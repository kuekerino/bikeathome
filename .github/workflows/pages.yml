# Publishes the built site to GitHub Pages on every push to main.
#
# Pages has to be switched on by hand once: Settings -> Pages -> Source: GitHub
# Actions. Until then configure-pages fails with a bare 404, which reads as a
# broken workflow rather than an unset setting. The action's `enablement: true`
# looks like it would fix that, but it cannot: creating a Pages site needs
# repository-admin rights and GITHUB_TOKEN only has `pages: write`, so it fails
# with "Resource not accessible by integration" instead.
#
# The site lands on a project subpath (/bikeathome/). That works because the
# Vite build uses a relative base, so nothing here needs to know the URL.
#
# Building and publishing are two jobs, and publishing tries twice. Twice in
# a week, with the 3D view's textures making the upload 16 MB, the publish
# step ran straight after a successful upload and found no artifact at all:
# "Found 0 artifact(s)". GitHub lists a new artifact a little after it has
# taken it. Re-running the same run cannot help, because the late artifact
# then turns up alongside the new one and the action refuses two; only a fresh
# run worked. A second job starts on a fresh runner, which buys that little
# while, and if it is still not enough the second attempt waits a minute more.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.first.outputs.page_url || steps.second.outputs.page_url }}
    steps:
      - id: first
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.first.outcome == 'failure'
        run: |
          echo "The artifact was not listed yet. Waiting a minute, then trying once more."
          sleep 60
      - id: second
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v4
