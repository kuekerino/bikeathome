# Publishes the built site to GitHub Pages.
#
# Run by hand only. Pages cannot publish from a private repository without a
# paid plan, so firing this on every push to main would just produce a failing
# run for something nobody asked for. Enable Pages first (Settings -> Pages ->
# Source: GitHub Actions), then add a `push` trigger if you want it automatic.
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
