# Publishes the built site to GitHub Pages on every push to main.
#
# Pages has to be switched on by hand once: Settings -> Pages -> Source: GitHub
# Actions. Until then configure-pages fails with a bare 404, which reads as a
# broken workflow rather than an unset setting. The action's `enablement: true`
# looks like it would fix that, but it cannot: creating a Pages site needs
# repository-admin rights and GITHUB_TOKEN only has `pages: write`, so it fails
# with "Resource not accessible by integration" instead.
#
# The site lands on a project subpath (/bikeathome/). That works because the
# Vite build uses a relative base, so nothing here needs to know the URL.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
