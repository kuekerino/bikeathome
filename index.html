<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Ride your own GPX routes on a smart trainer, with virtual shifting."
    />
    <!-- Inline so the page never makes a request for it. -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>%F0%9F%9A%B4</text></svg>"
    />
    <title>bikeathome</title>
  </head>
  <body>
    <!--
      Applies the stored theme before the first paint. Without it a rider who
      chose light is shown a dark screen for a frame every time they open the
      page, which is exactly the flash the setting exists to avoid.
    -->
    <script>
      try {
        var stored = JSON.parse(localStorage.getItem('bikeathome.settings.v1') || '{}')
        var look = stored.appearance || {}
        var dark =
          look.theme === 'dark' ||
          (look.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        var root = document.documentElement
        root.dataset.theme = dark ? 'dark' : 'light'
        root.dataset.contrast = look.highContrast ? 'high' : 'normal'
        root.style.setProperty('--text-scale', String(look.textScale || 1))
      } catch (e) {
        // Storage blocked, or something that is not JSON. The stylesheet's own
        // defaults are a complete theme, so there is nothing to recover.
      }
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
