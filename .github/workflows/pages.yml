# Publishes the built site to GitHub Pages on every push to main.
#
# Requires Pages to be switched on once: Settings -> Pages -> Source: GitHub
# Actions. Without that the deploy step fails with a 404, which reads as a
# broken workflow rather than a missing setting.
#
# The site lands on a project subpath (/bikeathome/). That works because the
# Vite build uses a relative base, so nothing here needs to know the URL.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
